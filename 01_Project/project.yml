name: QuickStatsPanel
options:
  bundleIdPrefix: com.sim
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1100"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Sources/QuickStatsPanel/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Sources/QuickStatsPanel/Resources/QuickStatsPanel.entitlements
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Signing is NOT set here on purpose: settings declared in project.yml land in
    # the .pbxproj, which overrides xcconfig values. Debug signing comes from
    # Config/Debug.xcconfig → Debug.local.xcconfig (per-machine). Release stays on
    # Xcode's implicit automatic signing until notarization is set up. (docs/28)

configs:
  Debug: debug
  Release: release

targets:
  QuickStatsPanel:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
    sources:
      - path: Sources/QuickStatsPanel
        excludes:
          - "Resources/Info.plist"
          - "Resources/QuickStatsPanel.entitlements"
    resources:
      - path: Sources/QuickStatsPanel/Resources
        excludes:
          - "Info.plist"
          - "QuickStatsPanel.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.QuickStatsPanel
        PRODUCT_NAME: QuickStatsPanel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # IOReport (D-019 Power tile): no public header, no Swift overlay. Declare
        # the C prototypes in a bridging header and link the private framework
        # directly — resolves against /usr/lib/libIOReport.tbd in the dyld shared
        # cache (no dlopen, no relocated-framework Library-Validation issue).
        # IOHID temperature sensors (D-018 Temperatures tile): same bridging header,
        # symbols resolve from IOKit.framework — hence the explicit -framework IOKit.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/QuickStatsPanel/QuickStatsPanel-Bridging-Header.h
        OTHER_LDFLAGS: -lIOReport -framework IOKit

  QuickStatsPanelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuickStatsPanelTests
      # Hostless logic tests: importing the SwiftUI @main application as an XCTest
      # host creates a second NSApplication and crashes before tests bootstrap.
      # Compile the pure units under test into the bundle instead.
      - path: Sources/QuickStatsPanel/Model/StatHistory.swift
      - path: Sources/QuickStatsPanel/Sampling/NetworkSampler.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sim.QuickStatsPanelTests

schemes:
  QuickStatsPanel:
    build:
      targets:
        QuickStatsPanel: all
        QuickStatsPanelTests: [test]
    test:
      targets:
        - QuickStatsPanelTests
